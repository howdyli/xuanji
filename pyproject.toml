[project]
name = "xiaopaw-v2"
version = "3.0.0"
description = "XiaoPaw v3 — Feishu local AI work assistant with Hook framework"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "requests>=2.31",
    "crewai>=1.9.3",
    "lark-oapi>=1.3",
    "weasyprint>=60.0",
    "python-docx>=1.0",
    "python-pptx>=1.0",
    "markdown>=3.5",
    "pypdf>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xiaopaw*", "shared_hooks*"]

[project.optional-dependencies]
full = [
    "psycopg2-binary>=2.9",
    "openai>=1.0",
    "croniter>=2.0",
    "filelock>=3.13",
    "prometheus_client>=0.20",
    "cachetools>=5.3",
    "langfuse>=4.0",
    "pdfplumber>=0.11",
    "pdf2image>=1.17",
]
export = [
    "weasyprint>=60.0",
    "python-docx>=1.0",
    "python-pptx>=1.0",
    "markdown>=3.5",
]
# 远程长期记忆（agent-memory-system）对接；本地开发安装：
#   pip install -e ../pm/agent-memory-system/sdk-python
remote-memory = [
    "agent-memory-sdk>=0.1.1,<1.0.0",  # 下界=提供公开 request() 的版本；_sdk_request 已改走公开接口，上界放宽至主版本；0.1.1 未发布至 registry，需本地安装（pip install -e pm/agent-memory-system/sdk-python）或先行发布
]
rerank = ["FlagEmbedding>=1.2", "sentence-transformers>=2.7"]
ocr = ["pdfplumber>=0.11", "pytesseract>=0.3", "pdf2image>=1.17"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "respx>=0.21",
    "pypdf>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 600
markers = [
    "integration: integration tests (deselect with -m 'not integration')",
    "llm_dependent: tests that depend on LLM behavior",
    "sandbox: tests that require AIO-Sandbox",
    "sandbox_required: e2e tests that require sandbox MCP",
    "pgvector_required: e2e tests that require pgvector",
    "security: security attack/defense tests",
    "observability: observability/Langfuse verification tests",
    "no_llm: e2e tests without LLM (slash commands, routing)",
    "e2e: end-to-end tests via TestAPI",
    "full: full e2e tests with sandbox + pgvector",
]

[tool.coverage.run]
source = ["xiaopaw", "shared_hooks"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
